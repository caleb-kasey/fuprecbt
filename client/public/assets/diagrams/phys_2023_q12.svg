<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220">
  <defs>
    <style>text { font-family: Georgia, serif; fill: #222; }</style>
  </defs>

  <!-- Outer circuit rectangle: top-left(30,80), top-right(470,80), bottom-right(470,160), bottom-left(30,160) -->

  <!-- Top wire: left segment -->
  <line x1="30" y1="80" x2="100" y2="80" stroke="#444" stroke-width="2.5"/>

  <!-- Capacitor 1 at x=110~140 -->
  <line x1="100" y1="80" x2="115" y2="80" stroke="#444" stroke-width="2.5"/>
  <line x1="115" y1="60" x2="115" y2="100" stroke="#444" stroke-width="3.5"/>
  <line x1="130" y1="60" x2="130" y2="100" stroke="#444" stroke-width="3.5"/>
  <line x1="130" y1="80" x2="185" y2="80" stroke="#444" stroke-width="2.5"/>
  <text x="122" y="52" font-size="16" text-anchor="middle">6µF</text>

  <!-- Capacitor 2 at x=200~230 -->
  <line x1="200" y1="60" x2="200" y2="100" stroke="#444" stroke-width="3.5"/>
  <line x1="215" y1="60" x2="215" y2="100" stroke="#444" stroke-width="3.5"/>
  <line x1="215" y1="80" x2="290" y2="80" stroke="#444" stroke-width="2.5"/>
  <text x="207" y="52" font-size="16" text-anchor="middle">6µF</text>

  <!-- Capacitor 3 at x=300~330 -->
  <line x1="290" y1="80" x2="305" y2="80" stroke="#444" stroke-width="2.5"/>
  <line x1="305" y1="60" x2="305" y2="100" stroke="#444" stroke-width="3.5"/>
  <line x1="320" y1="60" x2="320" y2="100" stroke="#444" stroke-width="3.5"/>
  <line x1="320" y1="80" x2="470" y2="80" stroke="#444" stroke-width="2.5"/>
  <text x="312" y="52" font-size="16" text-anchor="middle">6µF</text>

  <!-- Right side wire -->
  <line x1="470" y1="80" x2="470" y2="160" stroke="#444" stroke-width="2.5"/>

  <!-- Bottom wire -->
  <line x1="470" y1="160" x2="270" y2="160" stroke="#444" stroke-width="2.5"/>

  <!-- Cell/Battery symbol at bottom center -->
  <!-- Long line (positive) -->
  <line x1="255" y1="145" x2="255" y2="175" stroke="#444" stroke-width="3"/>
  <!-- Short line (negative) -->
  <line x1="245" y1="152" x2="245" y2="168" stroke="#444" stroke-width="2"/>
  <!-- Positive terminal label -->
  <text x="265" y="152" font-size="14">+</text>
  <!-- Negative terminal label -->
  <text x="232" y="165" font-size="14">−</text>

  <!-- Continue bottom wire from cell to left -->
  <line x1="245" y1="160" x2="30" y2="160" stroke="#444" stroke-width="2.5"/>

  <!-- Left side wire -->
  <line x1="30" y1="160" x2="30" y2="80" stroke="#444" stroke-width="2.5"/>
</svg>
