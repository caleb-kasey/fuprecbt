<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <defs>
    <style>
      text { font-family: Georgia, serif; fill: #222; font-size: 15px; }
      .bond { stroke: #333; stroke-width: 2; }
    </style>
  </defs>

  <!--
    Compound: CH3-CH2-CH2-CH2-CH-CH2-CH3
                                |
                               CH2
                                |
                               CH2
                                |
                               CH3
    Main chain: CH3(1) - CH2(2) - CH2(3) - CH2(4) - CH(5) - CH2(6) - CH3(7)
    Branch on C5: CH2 - CH2 - CH3 (propyl group, going downward)
  -->

  <!-- ── Main chain ── -->
  <!-- C1: CH3 -->
  <text x="20" y="100">CH₃</text>
  <!-- bond C1-C2 -->
  <line x1="58" y1="95" x2="80" y2="95" class="bond"/>
  <!-- C2: CH2 -->
  <text x="82" y="100">CH₂</text>
  <!-- bond C2-C3 -->
  <line x1="118" y1="95" x2="140" y2="95" class="bond"/>
  <!-- C3: CH2 -->
  <text x="142" y="100">CH₂</text>
  <!-- bond C3-C4 -->
  <line x1="178" y1="95" x2="200" y2="95" class="bond"/>
  <!-- C4: CH2 -->
  <text x="202" y="100">CH₂</text>
  <!-- bond C4-C5 -->
  <line x1="238" y1="95" x2="260" y2="95" class="bond"/>
  <!-- C5: CH (branch point) -->
  <text x="262" y="100">CH</text>
  <!-- bond C5-C6 -->
  <line x1="288" y1="95" x2="310" y2="95" class="bond"/>
  <!-- C6: CH2 -->
  <text x="312" y="100">CH₂</text>
  <!-- bond C6-C7 -->
  <line x1="348" y1="95" x2="370" y2="95" class="bond"/>
  <!-- C7: CH3 -->
  <text x="372" y="100">CH₃</text>

  <!-- ── Branch (propyl group) going downward from C5 ── -->
  <!-- bond C5 down -->
  <line x1="272" y1="102" x2="272" y2="124" class="bond"/>
  <!-- Branch C1: CH2 -->
  <text x="256" y="140">CH₂</text>
  <!-- bond branch C1-C2 -->
  <line x1="272" y1="142" x2="272" y2="162" class="bond"/>
  <!-- Branch C2: CH2 -->
  <text x="256" y="178">CH₂</text>
  <!-- bond branch C2-C3 -->
  <line x1="272" y1="180" x2="272" y2="200" class="bond"/>
  <!-- Branch C3: CH3 -->
  <text x="256" y="216">CH₃</text>
</svg>
