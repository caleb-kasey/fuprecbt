<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300">
  <defs>
    <style>text { font-family: Georgia, serif; fill: #222; }</style>
    <!-- Arrowhead markers -->
    <marker id="arrow" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>

  <!-- Origin point at (80, 230) -->

  <!-- Vertical arrow: 6.0N upward -->
  <line x1="80" y1="230" x2="80" y2="40"
        stroke="#444" stroke-width="2.5"
        marker-end="url(#arrow)"/>
  <text x="30" y="140" font-size="20" text-anchor="middle">6.0N</text>

  <!-- Horizontal arrow: 80N rightward -->
  <line x1="80" y1="230" x2="310" y2="230"
        stroke="#444" stroke-width="2.5"
        marker-end="url(#arrow)"/>
  <text x="200" y="262" font-size="20" text-anchor="middle">80N</text>

  <!-- Right angle box at origin -->
  <rect x="80" y="216" width="14" height="14"
        fill="none" stroke="#444" stroke-width="1.8"/>
</svg>
