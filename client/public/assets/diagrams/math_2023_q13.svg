<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <style>text { font-family: Georgia, serif; fill: #222; }</style>
  </defs>

  <!-- Circle -->
  <circle cx="160" cy="160" r="130" fill="white" stroke="#444" stroke-width="2.2"/>

  <!-- 
    Cyclic quadrilateral ABCD on the circle
    A = top    (160, 30)
    B = right  (285, 160)
    C = bottom (160, 290)
    D = left   (35, 160)
  -->

  <!-- Quadrilateral sides -->
  <polygon points="160,30 285,160 160,290 35,160"
           fill="none" stroke="#444" stroke-width="2.2"/>

  <!-- Vertex labels -->
  <text x="160" y="22" font-size="20" text-anchor="middle">A</text>
  <text x="298" y="165" font-size="20" text-anchor="start">B</text>
  <text x="160" y="312" font-size="20" text-anchor="middle">C</text>
  <text x="18" y="165" font-size="20" text-anchor="middle">D</text>

  <!-- Angle at B = 108° -->
  <path d="M 263,148 A 25 25 0 0 0 263,172" fill="none" stroke="#444" stroke-width="1.8"/>
  <text x="248" y="165" font-size="16" text-anchor="middle">108°</text>

  <!-- Angle at D = x° -->
  <path d="M 57,148 A 25 25 0 0 1 57,172" fill="none" stroke="#444" stroke-width="1.8"/>
  <text x="72" y="165" font-size="16" text-anchor="middle">x°</text>
</svg>
